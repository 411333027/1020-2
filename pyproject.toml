[project]
name = "food-agent"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = 'LENOVO-GRACE\Grace', email = "411333027@gms.ndhu.edu.tw" }
]
requires-python = ">=3.12"
dependencies = [
    "discord-py>=2.7.1",
    "openpyxl>=3.1.5",
    "pillow>=13.0.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
food-agent = "food_agent:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.1",
]
